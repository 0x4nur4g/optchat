name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      # A tag that disagrees with package.json is the exact confusion releases
      # exist to remove, so refuse rather than publish it.
      - name: Tag must match package.json
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
